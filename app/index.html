<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prototype • แอปเจ้าหน้าที่ (FondueManager)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/sensitive-flow.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Noto Sans Thai", sans-serif;
    background: transparent;
    color: #2f241e;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 30px;
    gap: 16px;
  }


  /* กรอบมือถือ — เป็นแค่การจำลองหน้าตา ไม่ใช่ของจริงจาก React Native */
  .phone {
    width: 390px;
    max-width: 100%;
    background: #fff;
    border-radius: 34px;
    border: 9px solid #1d232b;
    overflow: hidden;
    box-shadow: 0 22px 50px rgba(20, 28, 38, 0.24);
    display: flex;
    flex-direction: column;
    height: 800px;
  }

  .statusbar {
    background: #1d232b;
    color: #fff;
    font-size: 12px;
    padding: 7px 20px 11px;
    display: flex;
    justify-content: space-between;
  }

  .appbar {
    background: #714727;
    color: #fff;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .appbar__back { font-size: 20px; line-height: 1; }
  .appbar__title { font-size: 16px; font-weight: 700; }

  .screen {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: #f7f8fa;
  }

  .rn-card {
    background: #fff;
    border-radius: 14px;
    padding: 15px;
    box-shadow: 0 1px 3px rgba(23, 32, 43, 0.08);
  }

  .rn-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 14px;
    padding: 5px 0;
  }
  .rn-row__label { color: #8b95a1; }
  .rn-row__value { font-weight: 600; text-align: right; }

  .status-pill {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    background: #fff3d4;
    color: #8a6300;
    font-size: 12px;
    font-weight: 700;
  }

  .ticket-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .ticket-head__id { font-size: 17px; font-weight: 700; }

  .slot {
    border: 1px dashed #c8d0d9;
    border-radius: 12px;
    padding: 13px 15px;
    color: #8b95a1;
    font-size: 12.5px;
    line-height: 1.7;
    background: #fbfcfd;
  }
  .slot strong { color: #5d6975; }

  .tabbar {
    display: flex;
    border-top: 1px solid #e6e9ee;
    background: #fff;
    padding: 9px 0 15px;
  }
  .tabbar div {
    flex: 1;
    text-align: center;
    font-size: 11px;
    color: #98a2ae;
  }
  .tabbar div[aria-current] { color: #714727; font-weight: 700; }
  .tabbar .dot {
    width: 18px; height: 18px; margin: 0 auto 4px;
    border-radius: 5px; background: currentColor; opacity: .85;
  }

  /* ในจอมือถือ ภาพประกอบวางเรียง 2 ช่องพอ */
  .phone .sv-media { grid-template-columns: repeat(2, 1fr); }
</style>
</head>
<body>


<div class="phone">
  <div class="statusbar"><span>9:41</span><span>▮▮▮ ▲ ▰</span></div>
  <div class="appbar">
    <span class="appbar__back">‹</span>
    <span class="appbar__title">รายละเอียดเรื่องแจ้ง</span>
  </div>

  <div class="screen">
    <div class="rn-card">
      <div class="ticket-head">
        <span class="ticket-head__id">2026-6U23NF</span>
        <span class="status-pill">กำลังดำเนินการ</span>
      </div>
      <div class="rn-row"><span class="rn-row__label">ประเภท</span><span class="rn-row__value">ทางเท้า</span></div>
      <div class="rn-row"><span class="rn-row__label">หน่วยงาน</span><span class="rn-row__value">Traffy @ ITS Lab2</span></div>
      <div class="rn-row"><span class="rn-row__label">แจ้งเมื่อ</span><span class="rn-row__value">20 ส.ค. 69 14:20</span></div>
      <div class="rn-row"><span class="rn-row__label">ที่อยู่</span><span class="rn-row__value">*****</span></div>
    </div>

    <div class="rn-card sv-root" id="sensitive-slot"></div>

    <div class="slot"><strong>ปุ่มปรับสถานะ / ส่งต่อ</strong> — จาก ProblemOnlyOne.js</div>
    <div class="slot"><strong>Timeline</strong> — เรื่อง sensitive แสดงเป็นภาพที่ render มาแทนข้อความ</div>
  </div>

  <div class="tabbar">
    <div><div class="dot"></div>หน้าแรก</div>
    <div aria-current="page"><div class="dot"></div>รายการแจ้ง</div>
    <div><div class="dot"></div>แจ้งเตือน</div>
    <div><div class="dot"></div>โปรไฟล์</div>
  </div>
</div>

<script type="module">
  import { mountSensitiveFlow } from "../shared/sensitive-flow.js";
  mountSensitiveFlow(document.getElementById("sensitive-slot"), {
    ticketId: "2026-6U23NF",
  });
</script>
</body>
</html>
