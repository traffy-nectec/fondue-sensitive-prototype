<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="ภาพถูกปกปิดข้อมูลอ่อนไหว">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe7de"/>
      <stop offset=".55" stop-color="#ded2c4"/>
      <stop offset="1" stop-color="#c9bbaa"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- เงาคนแบบเบลอ สื่อว่าภาพเดิมมีบุคคลอยู่ ไม่ใช่ภาพว่างเปล่า -->
  <g filter="url(#soft)" opacity=".5">
    <circle cx="300" cy="232" r="86" fill="#9d8b78"/>
    <path d="M158 470c0-78 64-132 142-132s142 54 142 132z" fill="#9d8b78"/>
  </g>

  <!-- แถบคาดตา -->
  <rect x="176" y="205" width="248" height="56" rx="10" fill="#2b2118"/>

  <!-- ไอคอนตาถูกขีดฆ่า -->
  <g transform="translate(300 372)" fill="none" stroke="#2b2118" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path d="M-52 0c14-20 32-30 52-30s38 10 52 30c-14 20-32 30-52 30S-38 20-52 0Z"/>
    <circle cx="0" cy="0" r="15"/>
    <path d="M-46-46 46 46"/>
  </g>

  <rect x="0" y="470" width="600" height="130" fill="#2b2118" opacity=".9"/>
  <text x="300" y="518" text-anchor="middle" fill="#fff"
        font-family="'IBM Plex Sans Thai','Noto Sans Thai',sans-serif" font-size="30" font-weight="700">
    ภาพถูกปกปิด
  </text>
  <text x="300" y="556" text-anchor="middle" fill="#e4d8ca"
        font-family="'IBM Plex Sans Thai','Noto Sans Thai',sans-serif" font-size="21">
    ปลดล็อกเพื่อดูภาพฉบับเต็ม
  </text>
</svg>
