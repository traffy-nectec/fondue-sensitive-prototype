<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prototype • LIFF ผู้แจ้ง</title>
<!-- CSS ตัวนี้คือของจริง compile จาก sensitive.scss + Detail.scss ของ fondue-liff-my-case
     markup ข้างล่างเขียนมือให้ตรงกับ Detail.jsx / SensitiveCaseView.jsx -->
<link rel="stylesheet" href="./assets/liff-real.css">
<style>
  html, body { margin: 0; background: #f5f5f5; }
  body { font-family: "IBM Plex Sans Thai", sans-serif; }
  .sensitive-image-lock-overlay {
    position: absolute;
    z-index: 2;
    right: 10px;
    bottom: 10px;
    left: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 8px 8px 12px;
    border-radius: 10px;
    color: #fff;
    background: rgba(32, 24, 19, .82);
    backdrop-filter: blur(5px);
    font-size: 14px;
    font-weight: 700;
  }
  .sensitive-image-lock-overlay .sensitive-toolbar-unlock {
    min-height: 36px;
    padding: 7px 12px;
    background: #fff;
    color: #57351f;
  }
  .sensitive-rendered-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid #dfc8b5;
    background: #fffaf6;
  }
  .sensitive-rendered-badges { display: flex; align-items: center; gap: 6px; }
  .sensitive-page-count {
    padding: 3px 8px;
    border-radius: 999px;
    color: #fff;
    background: #6b625d;
    font-size: 12px;
    font-weight: 700;
  }
  .sensitive-compact-gallery-button {
    min-height: 34px;
    padding: 6px 10px;
    border: 0;
    border-radius: 999px;
    color: #fff;
    background: #714727;
    font: 700 12px "IBM Plex Sans Thai", sans-serif;
  }
</style>
</head>
<body>

<div class="detail-page-container">
  <!-- แถบปุ่มด้านบน — fixed เหมือนของจริง เป็นที่มาของ .with-actions ที่เว้น padding-top ให้ -->
  <div class="header-detail-container">
    <div class="btn-container">
      <div class="reopen-btn">เพิ่มรูป/ไฟล์</div>
      <div class="talk-with-org-btn">คุยกับเจ้าหน้าที่</div>
    </div>
  </div>

  <div id="root"></div>
</div>

<script type="module" src="./liff.js"></script>
</body>
</html>
