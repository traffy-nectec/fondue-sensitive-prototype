<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prototype • LIFF ผู้แจ้ง</title>
<!-- CSS ตัวนี้คือของจริง compile จาก sensitive.scss + Detail.scss ของ fondue-liff-my-case
     markup ข้างล่างเขียนมือให้ตรงกับ Detail.jsx / SensitiveCaseView.jsx -->
<link rel="stylesheet" href="./assets/liff-real.css">
<!-- ชิ้นส่วนกลางที่ทั้ง 3 platform ใช้หน้าตาเดียวกัน (ปุ่มปลดล็อก · แถบ toolbar หลังปลดล็อก)
     โหลดทีหลัง liff-real.css เพื่อให้ทับของเดิมได้ -->
<link rel="stylesheet" href="../shared/sensitive-flow.css?v=5">
<style>
  html, body { margin: 0; background: #f5f5f5; }
  body { font-family: "IBM Plex Sans Thai", sans-serif; }
  .sensitive-image-lock-overlay {
    position: absolute;
    z-index: 2;
    right: 10px;
    bottom: 10px;
    left: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 8px 8px 12px;
    border-radius: 10px;
    color: #fff;
    background: rgba(32, 24, 19, .82);
    backdrop-filter: blur(5px);
    font-size: 14px;
    font-weight: 700;
  }
  /* ปุ่มปลดล็อก · แถบ toolbar หลังปลดล็อก · badge ย้ายไปอยู่ใน shared/sensitive-flow.css
     แล้ว (.sv-unlock, .sv-rendered-toolbar, .sv-security-badge, .sv-page-count,
     .sv-gallery-btn) เพื่อให้ทั้ง 3 platform ใช้ค่าชุดเดียวกัน */

  /* แถวปุ่มในโมดัล PIN — เพิ่มปุ่มยกเลิกให้ตรงกับ web และ app */
  .sensitive-pin-actions {
    display: flex;
    align-items: stretch;
    gap: 10px;
    margin-top: 8px;
  }
  /* ต้องเจาะจงถึง `.sensitive-pin-modal form` ให้ชนะกฎของจริงที่ตั้ง
     `.sensitive-pin-modal form .sensitive-primary-button{margin-top:20px}` ไว้
     ถ้าไม่ล้าง margin นั้น ปุ่มปลดล็อกจะดันความสูงแถวเป็น 68px
     แล้วปุ่มยกเลิกยืดตาม กลายเป็นสูงไม่เท่ากัน */
  .sensitive-pin-modal form .sensitive-pin-actions .sensitive-primary-button,
  .sensitive-pin-modal form .sensitive-pin-actions .sensitive-secondary-button {
    flex: 1;
    margin-top: 0;
  }
  /* ต้องตรงกับ .sensitive-primary-button ของจริงทุกค่า (min-height 48 / font 16 / radius 10)
     ไม่งั้นปุ่มสองอันในแถวเดียวกันสูงไม่เท่ากัน */
  .sensitive-secondary-button {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 10px 16px;
    border: 1px solid #e2d5c9;
    border-radius: 10px;
    background: #fff;
    color: #6b625d;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    /* ฟอนต์ IBM Plex Sans Thai มี line box สูงมากถ้าปล่อย normal (~46px ที่ 16px)
       ปุ่มจะสูงเกิน 48px ไปเอง แล้วไม่เท่ากับปุ่มปลดล็อก จึงตรึงไว้ที่ 1 */
    line-height: 1;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="detail-page-container">
  <!-- แถบปุ่มด้านบน — fixed เหมือนของจริง เป็นที่มาของ .with-actions ที่เว้น padding-top ให้ -->
  <div class="header-detail-container">
    <div class="btn-container">
      <div class="reopen-btn">เพิ่มรูป/ไฟล์</div>
      <div class="talk-with-org-btn">คุยกับเจ้าหน้าที่</div>
    </div>
  </div>

  <div id="root"></div>
</div>

<script type="module" src="./liff.js"></script>
</body>
</html>
