<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prototype ฟีเจอร์ Sensitive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Anuphan", sans-serif;
    background: #f4f1ee;
    color: #2f241e;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
  }

  /* ---------- หัวเรื่อง + แท็บ ---------- */

  header {
    background: #fff;
    border-bottom: 1px solid #e8ded5;
    padding: 16px 22px 0;
    flex: none;
  }
  .head-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    max-width: 1240px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 0; }
  .head-note { font-size: 13px; color: #9a8b7e; }
  .head-note strong { color: #7a5a12; }

  .tabs {
    display: flex;
    gap: 4px;
    max-width: 1240px;
    margin: 12px auto 0;
    overflow-x: auto;
  }
  .tab {
    appearance: none;
    border: none;
    background: transparent;
    font: inherit;
    color: #8a7a6d;
    padding: 10px 18px 12px;
    border-bottom: 3px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab:hover { color: #714727; }
  .tab[aria-selected="true"] {
    color: #714727;
    font-weight: 700;
    border-bottom-color: #714727;
  }

  /* ---------- พื้นที่แสดงผล ---------- */

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    padding: 0 22px 22px;
  }
  .stage {
    width: 100%;
    max-width: 1240px;
    height: 100%;
    display: flex;
    justify-content: center;
  }
  .stage.is-phone { align-items: flex-start; padding-top: 18px; }

  .frame-plain {
    width: 100%;
    height: 100%;
    border: 1px solid #e3ded8;
    border-radius: 12px;
    background: #fff;
    overflow: hidden;
  }

  /* กรอบมือถือสำหรับ LIFF — เป็นแค่การจำลองบริบท ไม่ใช่ของจริงจาก LINE */
  .phone-shell {
    width: 390px;
    max-width: 100%;
    height: 800px;
    background: #fff;
    border: 9px solid #1d232b;
    border-radius: 34px;
    overflow: hidden;
    box-shadow: 0 20px 44px rgba(20, 28, 38, 0.22);
    display: flex;
    flex-direction: column;
  }
  .phone-shell__bar {
    background: #1d232b;
    color: #fff;
    font-size: 12px;
    padding: 7px 20px 11px;
    display: flex;
    justify-content: space-between;
    flex: none;
  }

  iframe { display: block; width: 100%; height: 100%; border: none; }

  .panel { display: none; width: 100%; height: 100%; justify-content: center; }
  .panel.is-active { display: flex; }

  @media (max-width: 720px) {
    main { padding: 0 12px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="head-row">
    <h1>Prototype ฟีเจอร์ Sensitive</h1>
    <span class="head-note">กดลอง flow ปกปิดข้อมูลอ่อนไหวได้ก่อนระบบจริงขึ้น · <strong>ข้อมูลจำลองทั้งหมด</strong></span>
  </div>

  <div class="tabs" role="tablist" aria-label="เลือกมุมมอง platform">
    <button class="tab" role="tab" id="tab-liff" aria-controls="panel-liff" aria-selected="true" data-view="liff">
      LIFF ผู้แจ้ง
    </button>
    <button class="tab" role="tab" id="tab-web" aria-controls="panel-web" aria-selected="false" data-view="web">
      เว็บเจ้าหน้าที่
    </button>
    <button class="tab" role="tab" id="tab-app" aria-controls="panel-app" aria-selected="false" data-view="app">
      แอปเจ้าหน้าที่
    </button>
  </div>
</header>

<main>
  <div class="stage" id="stage">

    <section class="panel is-active" id="panel-liff" role="tabpanel" aria-labelledby="tab-liff">
      <div class="phone-shell">
        <div class="phone-shell__bar"><span>9:41</span><span>▮▮▮ ▲ ▰</span></div>
        <iframe title="LIFF ผู้แจ้ง" data-src="./liff/"></iframe>
      </div>
    </section>

    <section class="panel" id="panel-web" role="tabpanel" aria-labelledby="tab-web">
      <div class="frame-plain">
        <iframe title="เว็บเจ้าหน้าที่" data-src="./web/"></iframe>
      </div>
    </section>

    <section class="panel" id="panel-app" role="tabpanel" aria-labelledby="tab-app">
      <iframe title="แอปเจ้าหน้าที่" data-src="./app/"></iframe>
    </section>

  </div>
</main>


<script>
  const VIEWS = ["liff", "web", "app"];

  const tabs = [...document.querySelectorAll(".tab")];
  const stage = document.getElementById("stage");

  // โหลด iframe ตอนเปิดแท็บครั้งแรกเท่านั้น กันไม่ให้ทั้ง 3 ตัวโหลดพร้อมกัน
  const activate = (view, { push = true } = {}) => {
    tabs.forEach((tab) => {
      const selected = tab.dataset.view === view;
      tab.setAttribute("aria-selected", String(selected));
    });

    document.querySelectorAll(".panel").forEach((panel) => {
      panel.classList.toggle("is-active", panel.id === `panel-${view}`);
    });

    const frame = document.querySelector(`#panel-${view} iframe`);
    if (frame && !frame.src) frame.src = frame.dataset.src;

    stage.classList.toggle("is-phone", view !== "web");

    if (push && window.location.hash !== `#${view}`) {
      history.replaceState(null, "", `#${view}`);
    }
  };

  tabs.forEach((tab) => {
    tab.addEventListener("click", () => activate(tab.dataset.view));
  });

  // ลูกศรซ้าย/ขวาสลับแท็บได้ตามมาตรฐาน tablist
  document.querySelector(".tabs").addEventListener("keydown", (event) => {
    const step = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
    if (!step) return;
    event.preventDefault();
    const index = tabs.findIndex((tab) => tab.getAttribute("aria-selected") === "true");
    const next = tabs[(index + step + tabs.length) % tabs.length];
    next.focus();
    activate(next.dataset.view);
  });

  const initial = window.location.hash.replace("#", "");
  activate(VIEWS.includes(initial) ? initial : "liff", { push: false });
</script>
</body>
</html>
